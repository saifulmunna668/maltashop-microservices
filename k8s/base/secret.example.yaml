# EXAMPLE ONLY - never commit real values. In production these come from a secrets manager
# (e.g. External Secrets Operator syncing from AWS Secrets Manager or Vault, L6 p.83-84),
# and Kubernetes Secret encryption at rest must be enabled.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
type: Opaque
stringData:
  INTERNAL_JWT_SECRET: replace-me
  EXTERNAL_JWT_SECRET: replace-me
  PARTNER_KEYS: '[]'
  ORDER_DATABASE_URL: postgres://order_svc:replace-me@orders-db.internal:5432/orders_db?sslmode=require
  PAYMENT_DATABASE_URL: postgres://payment_svc:replace-me@payments-db.internal:5432/payments_db?sslmode=require
  INVENTORY_DATABASE_URL: postgres://inventory_svc:replace-me@inventory-db.internal:5432/inventory_db?sslmode=require
  AMQP_URL: amqps://platform:replace-me@rabbitmq.internal:5671
  PSP_API_KEY: replace-me
  EMAIL_PROVIDER_API_KEY: replace-me
  ADMIN_TOKEN: replace-me
