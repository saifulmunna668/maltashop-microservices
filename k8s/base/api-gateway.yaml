# api-gateway: rolling update with zero unavailable pods (L6 p.56-57, 62).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: { app: api-gateway }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: ghcr.io/OWNER/api-gateway:COMMIT_SHA   # set by kustomize images in the overlay
          ports:
            - containerPort: 8080
          env:
            - name: CATALOG_URL
              valueFrom: { configMapKeyRef: { name: platform-config, key: CATALOG_URL } }
            - name: INVENTORY_URL
              valueFrom: { configMapKeyRef: { name: platform-config, key: INVENTORY_URL } }
            - name: ORDER_URL
              valueFrom: { configMapKeyRef: { name: platform-config, key: ORDER_URL } }
            - name: RECOMMENDATION_URL
              valueFrom: { configMapKeyRef: { name: platform-config, key: RECOMMENDATION_URL } }
            - name: RATE_LIMIT_PARTNER
              valueFrom: { configMapKeyRef: { name: platform-config, key: RATE_LIMIT_PARTNER } }
            - name: RATE_LIMIT_CUSTOMER
              valueFrom: { configMapKeyRef: { name: platform-config, key: RATE_LIMIT_CUSTOMER } }
            - name: INTERNAL_JWT_SECRET
              valueFrom: { secretKeyRef: { name: platform-secrets, key: INTERNAL_JWT_SECRET } }
            - name: EXTERNAL_JWT_SECRET
              valueFrom: { secretKeyRef: { name: platform-secrets, key: EXTERNAL_JWT_SECRET } }
            - name: PARTNER_KEYS
              valueFrom: { secretKeyRef: { name: platform-secrets, key: PARTNER_KEYS } }
            - name: PORT
              value: "8080"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:          # process only; never checks dependencies (L6 p.101)
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          readinessProbe:         # dependencies; failing removes the pod from the Service
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels: { app: api-gateway }
spec:
  type: ClusterIP
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
