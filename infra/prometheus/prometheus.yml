global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    static_configs: [{ targets: ['api-gateway:9100'] }]
  - job_name: catalog-service
    static_configs: [{ targets: ['catalog-service:3000'] }]
  - job_name: inventory-service
    static_configs: [{ targets: ['inventory-service:3000'] }]
  - job_name: order-service
    static_configs: [{ targets: ['order-service:3000'] }]
  - job_name: payment-service
    static_configs: [{ targets: ['payment-service:3000'] }]
  - job_name: recommendation-service
    static_configs: [{ targets: ['recommendation-service:3000'] }]
  - job_name: notification-service
    static_configs: [{ targets: ['notification-service:3000'] }]
  # Queue depth and consumer counts per queue (rabbitmq_prometheus plugin).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs: [{ targets: ['rabbitmq:15692'] }]
